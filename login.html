<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stratmont Investments | Authentication</title>
    <meta name="description" content="Stratmont Capital — Login">
    <meta property="og:title" content="Stratmont Capital">
    <meta property="og:description" content="Stratmont Capital — Login">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="design-system.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-main);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }
        .auth-bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212,175,55,0.05) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }
        .auth-container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }
        .auth-card {
            background: rgba(20, 25, 40, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(0);
            transition: transform 0.3s ease;
        }
        .auth-card:hover {
            transform: translateY(-5px);
            border-color: rgba(212, 175, 55, 0.2);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-logo h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin: 0;
        }
        .auth-logo h2 span {
            color: var(--gold-primary);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #d4af37, #f8e1a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .auth-form-group {
            margin-bottom: 1.5rem;
        }
        .auth-form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
        }
        .auth-form-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .auth-form-group input:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.1);
        }
        .auth-submit {
            width: 100%;
            background: linear-gradient(135deg, #d4af37, #b08a3e);
            color: #000;
            border: none;
            padding: 0.875rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        .auth-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }
        .auth-switch {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .auth-switch a {
            color: var(--gold-primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .auth-switch a:hover {
            color: #f8e1a0;
            text-decoration: underline;
        }
        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
            font-size: 0.9rem;
        }
        .alert.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        .alert.success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #10b981;
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

    <div class="auth-bg-glow"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <h2><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon text-gold" style="color: var(--color-gold); margin-right: 8px; vertical-align: text-bottom;"><polygon points="6 3 18 3 22 9 12 22 2 9"></polygon></svg> STRATMONT</h2>
            </div>
            
            <div id="alertBox" class="alert"></div>

            <!-- LOGIN FORM -->
            <form id="loginForm">
                <div class="auth-form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="investor@example.com" required>
                </div>
                <div class="auth-form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-submit">Access Portal</button>
                <div class="auth-switch">
                    New to Stratmont? <a href="#" id="showRegister">Create an Account</a>
                </div>
            </form>

            <!-- REGISTER FORM -->
            <form id="registerForm" style="display: none;">
                <div class="auth-form-group">
                    <label for="regName">Full Legal Name</label>
                    <input type="text" id="regName" placeholder="John Doe" required>
                </div>
                <div class="auth-form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" placeholder="investor@example.com" required>
                </div>
                <div class="auth-form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-submit">Create Account</button>
                <div class="auth-switch">
                    Already an investor? <a href="#" id="showLogin">Sign In</a>
                </div>
            </form>

        </div>
    </div>

    <script src="config.js"></script>
    <script src="theme.js"></script>
    <script src="auth.js?v=2"></script>
</body>
</html>
